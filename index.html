<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Contactos</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1f2421;
    --ink-soft: #5a615c;
    --line: #dedad2;
    --accent: #2f5d50;
    --accent-soft: #e4ece9;
    --error: #a3402c;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100%;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header {
    margin-bottom: 36px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 0.98rem;
    margin: 0;
    max-width: 46ch;
    line-height: 1.5;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 28px;
  }
  .panel h2 {
    margin: 0 0 18px;
    font-size: 1.15rem;
    font-weight: 600;
  }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  input[type="text"], input[type="tel"] {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fdfcfa;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .actions {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
  }
  button {
    font-family: inherit;
    font-size: 0.98rem;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #244a40; }
  button:disabled { background: #a9b6b1; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.ghost:hover { background: var(--accent-soft); }
  .status {
    font-size: 0.88rem;
    color: var(--ink-soft);
  }
  .status.error { color: var(--error); }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }
  .count {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  ul.contacts {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  ul.contacts li {
    background: var(--panel);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .name {
    font-weight: 600;
  }
  .phone {
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .empty, .loading {
    padding: 30px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .skeleton {
    height: 48px;
    border-radius: 8px;
    background: linear-gradient(90deg, #ececea 25%, #f5f4f2 37%, #ececea 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s infinite;
    margin-bottom: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
  }
  @media (max-width: 480px) {
    form { grid-template-columns: 1fr; }
    .wrap { padding: 32px 16px 60px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agenda de contactos</h1>
    <p class="sub">Consulta y agrega contactos guardados en el servicio remoto de agenda.</p>
  </header>

  <section class="panel">
    <h2>Nuevo contacto</h2>
    <form id="contact-form">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" autocomplete="family-name" required>
      </div>
      <div class="field full">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" required>
      </div>
      <div class="actions">
        <button type="submit" id="save-btn">Guardar contacto</button>
        <span class="status" id="form-status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="list-header">
      <h2>Contactos guardados</h2>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="count" id="contact-count"></span>
        <button class="ghost" id="refresh-btn" type="button">Actualizar</button>
      </div>
    </div>
    <div id="list-area">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </section>
</div>

<script>
  const AGENDA_URL = "http://www.raydelto.org/agenda.php";

  const listArea = document.getElementById("list-area");
  const contactCount = document.getElementById("contact-count");
  const form = document.getElementById("contact-form");
  const saveBtn = document.getElementById("save-btn");
  const formStatus = document.getElementById("form-status");
  const refreshBtn = document.getElementById("refresh-btn");

  function setFormStatus(text, isError) {
    formStatus.textContent = text || "";
    formStatus.classList.toggle("error", !!isError);
  }

  function renderContacts(contacts) {
    if (!Array.isArray(contacts) || contacts.length === 0) {
      listArea.innerHTML = '<div class="empty">Todavía no hay contactos. Agrega el primero arriba.</div>';
      contactCount.textContent = "";
      return;
    }
    contactCount.textContent = contacts.length + (contacts.length === 1 ? " contacto" : " contactos");
    const ul = document.createElement("ul");
    ul.className = "contacts";
    contacts.forEach(c => {
      const nombre = c.nombre ?? c.Nombre ?? "";
      const apellido = c.apellido ?? c.Apellido ?? "";
      const telefono = c.telefono ?? c.Telefono ?? c.telefono_numero ?? "";
      const li = document.createElement("li");
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = [nombre, apellido].filter(Boolean).join(" ");
      const phoneSpan = document.createElement("span");
      phoneSpan.className = "phone";
      phoneSpan.textContent = telefono;
      li.appendChild(nameSpan);
      li.appendChild(phoneSpan);
      ul.appendChild(li);
    });
    listArea.innerHTML = "";
    listArea.appendChild(ul);
  }

  async function loadContacts() {
    listArea.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    try {
      const res = await fetch(AGENDA_URL, { method: "GET" });
      if (!res.ok) throw new Error("Respuesta HTTP " + res.status);
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (parseErr) {
        throw new Error("La respuesta del servidor no es JSON válido.");
      }
      renderContacts(data);
    } catch (err) {
      listArea.innerHTML =
        '<div class="empty">No se pudo cargar la agenda. ' +
        (err && err.message ? err.message : "Error de red.") +
        "</div>";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nombre = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const telefono = document.getElementById("telefono").value.trim();

    if (!nombre || !apellido || !telefono) {
      setFormStatus("Completa los tres campos.", true);
      return;
    }

    saveBtn.disabled = true;
    setFormStatus("Guardando...", false);

    try {
      const res = await fetch(AGENDA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, apellido, telefono })
      });
      if (!res.ok) throw new Error("Respuesta HTTP " + res.status);
      setFormStatus("Contacto guardado.", false);
      form.reset();
      document.getElementById("nombre").focus();
      await loadContacts();
    } catch (err) {
      setFormStatus(
        "No se pudo guardar el contacto. " + (err && err.message ? err.message : "Error de red."),
        true
      );
    } finally {
      saveBtn.disabled = false;
    }
  });

  refreshBtn.addEventListener("click", loadContacts);

  loadContacts();
</script>
</body>
</html>
